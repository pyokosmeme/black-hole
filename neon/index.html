<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Black Hole</title>
  <style>
    html, body { margin: 0; height: 100%; background: #030508; overflow: hidden; }
    #blackhole-container, #blackhole-container canvas { position: fixed; inset: 0; display: block; }

  <script src="../js-libs/three.min.js"></script>
  <script src="../js-libs/Detector.js"></script>
  <script src="../js-libs/mustache.min.js"></script>
  <script src="../js-libs/dat.gui.min.js"></script>
  <script src="../three-js-monkey-patch.js"></script>
  <script src="../js/acidburn-galaxy.js"></script>
  <script>
    window.NEON_BASE = '../';
    window.NEON_SHADER_NEON = 'raytracer-neon.glsl';
    window.NEON_SHADER_ORIG = '../raytracer.glsl';
  </script>
  <script src="neon-blackhole.js"></script>

</html>
