<body class="transit-page">
    <!-- Skip Link -->
    <a href="#main" class="skip-link">Skip to main content</a>
    
    <!-- Static Background (lite mode fallback) -->
    <div class="static-bg" aria-hidden="true"></div>
    
    <!-- Black Hole Background -->
    <div id="blackhole-container" aria-hidden="true"></div>
    
    <!-- Original black hole UI elements (hidden) -->
    <div id="hint-text" class="hidden-phone initially-hidden"></div>
    <div class="info"><div id="loader">Loading...</div></div>
    <div class="link-bar"></div>

    <!-- Header -->
    <header class="header-bar" role="banner">
        <div class="header-texture" aria-hidden="true"></div>
        <div class="header-noise" aria-hidden="true"></div>
        <div class="header-shimmer" aria-hidden="true"></div>
        
        <!-- Navigation Menu -->
        <div id="nav-menu"></div>

        <div class="header-content-wrapper">
            <a href="/maps" class="header-brand">POSSIBLE TERRITORIES</a>
        </div>

        <!-- Mode Toggle (inserted by acidburn-mode.js) -->
    </header>

    <!-- Main Content -->
    <main id="main" class="main-content map-window-shell" role="main">
        <section class="author-card map-window transit-window" data-map-window aria-labelledby="chart-title">
          <div class="section-header window-toolbar"><h2 id="chart-title">TRANSIT NETWORK</h2><div class="section-line"></div><div class="window-actions" role="group" aria-label="Window controls">
  <button class="acidburn-button" type="button" data-window-expand aria-pressed="false" aria-label="Expand window" title="Expand window">
    <svg class="expand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg>
    <svg class="collapse-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h6V3m6 0v6h6M9 21v-6H3m18 0h-6v6"/></svg>
  </button>
  <a class="acidburn-button" href="/maps" aria-label="Close window and return to Maps" title="Close window · Maps">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
  </a>
</div></div>
          <!-- The map fills the window; overlays and the route planner float over it. -->
          <div class="map-viewport" id="map-container">
            <svg id="transit-map" viewBox="0 0 1600 1000" role="img" aria-label="Transit map of inhabited space"></svg>

            <div class="map-hud map-hud-tl" data-label-avoid>
              <div class="map-picker" id="map-picker"></div>
              <ul class="legend" aria-label="Faction routes">
                <li><span class="legend-line uplb-route"></span>UPLB</li>
                <li><span class="legend-line swi-route"></span>SWI</li>
                <li><span class="legend-line hw-route"></span>Homeworlds</li>
                <li><span class="legend-line inter-route"></span>Inter-faction</li>
              </ul>
            </div>
            <div class="map-hud map-hud-bl"><p class="map-hint"></p></div>
            <div class="map-hud map-hud-br" data-label-avoid>
              <div class="map-controls" role="group" aria-label="Map controls">
                <button class="acidburn-button" type="button" data-pane-toggle="route-pane" aria-controls="route-pane" aria-expanded="false"><span class="route-button-label">route</span></button>
                <button class="acidburn-button icon" type="button" data-map-action="fit" aria-label="Fit map" title="Fit map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="2.5"/></svg></button>
                <button class="acidburn-button icon" type="button" data-map-action="in" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
                <button class="acidburn-button icon" type="button" data-map-action="out" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
              </div>
            </div>

            <aside class="author-card map-pane" id="route-pane" data-map-pane data-label-avoid hidden aria-labelledby="route-pane-title">
              <div class="section-header window-toolbar"><h2 id="route-pane-title">ROUTE PLANNER</h2><div class="section-line"></div><div class="window-actions">
                <button class="acidburn-button" type="button" data-pane-close aria-label="Close route planner" title="Close route planner"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
              </div></div>
              <div class="map-pane-body route-planner" id="route-planner-body">
                <div id="route-content"></div>
              </div>
            </aside>
          </div>
        </section>
    </main>

    <!-- Black hole shaders -->
    <script id="vertex-shader" type="x-shader/x-vertex">
        void main() { gl_Position = vec4(position, 1.0); }
    </script>
    <script data-src="raytracer.glsl" data-name="raytracer" type="x-shader/x-fragment"></script>

    <script src="js/acidburn-mode.js"></script>

    <script src="nav-menu.js"></script>
