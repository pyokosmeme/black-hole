<!DOCTYPE html>
<html lang="en">
<head>
    <title>Inhabited Space Transit Network — 2370 SolUT</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="K-Tube route planner for inhabited space transit network">
    <link rel="icon" href="/img/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/acidburn.css?v=10">
    <link rel="stylesheet" href="css/transit-map.css?v=16">
    <link rel="stylesheet" href="css/map-window.css?v=8">

  <script src="js-libs/three.min.js"></script>
  <script src="js-libs/jquery-2.1.4.min.js"></script>
  <script src="js-libs/Detector.js"></script>
  <script src="js-libs/ShaderLoader.min.js"></script>
  <script src="js-libs/mustache.min.js"></script>
  <script src="three-js-monkey-patch.js"></script>
  <script src="js/acidburn-galaxy.js"></script>
</head>
<body class="transit-page">
    <!-- Skip Link -->
    <a href="#main" class="skip-link">Skip to main content</a>
    
    <!-- Static Background (lite mode fallback) -->
    <div class="static-bg" aria-hidden="true"></div>
    
    <!-- Black Hole Background -->
    <div id="blackhole-container" aria-hidden="true"></div>
    
    <!-- Original black hole UI elements (hidden) -->
    <div id="hint-text" class="hidden-phone initially-hidden"></div>
    <div class="info"><div id="loader">Loading...</div></div>
    <div class="link-bar"></div>

    <!-- Header -->
    <header class="header-bar" role="banner">
        <div class="header-texture" aria-hidden="true"></div>
        <div class="header-noise" aria-hidden="true"></div>
        <div class="header-shimmer" aria-hidden="true"></div>
        
        <!-- Navigation Menu -->
        <div id="nav-menu"></div>

        <div class="header-content-wrapper">
            <a href="/maps" class="header-brand">POSSIBLE TERRITORIES</a>
        </div>

        <!-- Mode Toggle (inserted by acidburn-mode.js) -->
    </header>

    <!-- Main Content -->
    <main id="main" class="main-content map-window-shell" role="main">
        <section class="author-card map-window transit-window" data-map-window aria-labelledby="chart-title">
          <div class="section-header window-toolbar"><h2 id="chart-title">TRANSIT NETWORK</h2><div class="section-line"></div><div class="window-actions" role="group" aria-label="Window controls">
  <button class="acidburn-button" type="button" data-window-expand aria-pressed="false" aria-label="Expand window" title="Expand window">
    <svg class="expand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg>
    <svg class="collapse-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h6V3m6 0v6h6M9 21v-6H3m18 0h-6v6"/></svg>
  </button>
  <a class="acidburn-button" href="/maps" aria-label="Close window and return to Maps" title="Close window · Maps">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
  </a>
</div></div>
          <div class="transit-grid">
            <!-- Map -->
            <div id="map-container">
                <svg id="transit-map" viewBox="0 0 1600 1000" role="img" aria-label="Transit map of inhabited space"></svg>
                
                <div class="legend">
                    <h3>FACTION ROUTES</h3>
                    <div class="legend-item">
                        <div class="legend-line uplb-route"></div>
                        <span>UPLB</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-line swi-route"></div>
                        <span>SWI</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-line hw-route"></div>
                        <span>Homeworlds</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-line inter-route"></div>
                        <span>Inter-faction</span>
                    </div>
                </div>
            </div>
            
            <!-- Route Planner Panel -->
            <div class="route-planner">
                <div class="planner-header">
                    <h2>ROUTE PLANNER</h2>
                    <button class="clear-btn" onclick="clearRoute()">CLEAR ROUTE</button>
                </div>
                
                <div id="route-content">
                    <div class="empty-state">
                        <div class="empty-state-icon">✧</div>
                        <div class="empty-state-text">Click stations on the map to plan your route</div>
                    </div>
                </div>
            </div>
        </div>

        </section>
    </main>

    <!-- Black hole shaders -->
    <script id="vertex-shader" type="x-shader/x-vertex">
        void main() { gl_Position = vec4(position, 1.0); }
    </script>
    <script data-src="raytracer.glsl" data-name="raytracer" type="x-shader/x-fragment"></script>

    <!-- Core Scripts -->
    <script src="js/acidburn-mode.js"></script>
    <script src="js/acidburn-blackhole.js"></script>
    
    <!-- Transit Map -->
    <script src="js/scene-label-layout.js?v=5"></script>
    <script src="js/transit-map.js?v=15"></script>
    <script src="js/map-window.js"></script>
    
    <!-- Navigation -->
    <script src="nav-menu.js"></script>
</body>
</html>
