<body class="yake-atlas">
  <a class="skip-link" href="#main">Skip to atlas</a>
  <div class="static-bg" aria-hidden="true"></div>
  <div id="blackhole-container" aria-hidden="true"></div>
  <header class="header-bar">
    <div id="nav-menu"></div>
    <div class="header-content-wrapper"><a href="/maps" class="header-brand">POSSIBLE TERRITORIES</a></div>
  </header>
  <main id="main" class="main-content atlas-shell">
    <section class="author-card atlas-chart" aria-labelledby="chart-title">

    </section>
    <p id="selection-status" class="atlas-sr" role="status"></p>
    <noscript><p>This interactive atlas needs JavaScript. Ya Ke’s principal destinations are Jin (1.78 AU), Shu (2.142 AU), Celosia (6.13 AU, provisional), Gullinkambi and Chanticleer (51.4 AU), Xuan (67.4 AU), Five Islands (88.3 AU), and Kukkuta (152 AU).</p></noscript>
  </main>
  <script id="vertex-shader" type="x-shader/x-vertex">void main() { gl_Position = vec4(position, 1.0); }</script>
  <script data-src="raytracer.glsl" data-name="raytracer" type="x-shader/x-fragment"></script>
