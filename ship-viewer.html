<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Spacecraft View · Possible Territories</title>
  <meta name="description" content="Ex Astris Umbra ships, at true scale.">
  <link rel="icon" href="img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/acidburn.css">
  <link rel="stylesheet" href="css/map-window.css?v=9">
  <link rel="stylesheet" href="css/ship-viewer.css?v=4">
  <script defer src="js/map-window.js?v=9"></script>
  <script defer src="js/scene-label-layout.js?v=6"></script>
  <script defer src="js/ship-catalog.js?v=12"></script>
  <script defer src="js/ship-renderer.js?v=13"></script>
  <script defer src="js/ship-viewer.js?v=20"></script>
  <script defer src="js-libs/three.min.js"></script>
  <script defer src="js-libs/jquery-2.1.4.min.js"></script>
  <script defer src="js-libs/Detector.js"></script>
  <script defer src="js-libs/ShaderLoader.min.js"></script>
  <script defer src="js-libs/mustache.min.js"></script>
  <script defer src="three-js-monkey-patch.js"></script>
  <script defer src="js/acidburn-galaxy.js"></script>
  <script defer src="js/acidburn-mode.js"></script>
  <script defer src="js/acidburn-blackhole.js"></script>
  <script defer src="nav-menu.js"></script>
</head>
<body class="ship-viewer">
  <a class="skip-link" href="#main">Skip to schematic</a>
  <div class="static-bg" aria-hidden="true"></div>
  <div id="blackhole-container" aria-hidden="true"></div>
  <header class="header-bar">
    <div id="nav-menu"></div>
    <div class="header-content-wrapper"><a href="/maps" class="header-brand">POSSIBLE TERRITORIES</a></div>
  </header>
  <main id="main" class="main-content map-window-shell">
    <section class="author-card map-window" data-map-window aria-labelledby="chart-title">
      <div class="section-header window-toolbar"><h2 id="chart-title">SPACECRAFT VIEW</h2><div class="section-line"></div><div class="window-actions" role="group" aria-label="Window controls">
  <button class="acidburn-button" type="button" data-window-expand aria-pressed="false" aria-label="Expand window" title="Expand window">
    <svg class="expand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg>
    <svg class="collapse-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h6V3m6 0v6h6M9 21v-6H3m18 0h-6v6"/></svg>
  </button>
  <a class="acidburn-button" href="/maps" aria-label="Close window and return to Maps" title="Close window · Maps">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
  </a>
</div></div>
      <!-- The model fills the window; overlays and panes float over it. -->
      <div class="map-viewport" id="stage">
        <canvas id="stars" aria-hidden="true"></canvas>
        <canvas id="scene" tabindex="0" role="img" aria-label="Spacecraft model. Drag or use arrow keys to orbit; scroll, pinch or use plus and minus to zoom."></canvas>
        <div id="labels"><svg id="leaders" class="map-leaders" aria-hidden="true"></svg></div>

        <div class="map-hud map-hud-tl" data-label-avoid>
          <div class="map-picker">
            <select id="ship-select" aria-label="Choose spacecraft"><option value="el-cajon">El Cajon / Ergo Infinitum</option><option value="hackett">Hackett</option></select>
            <button id="compare-ships" class="acidburn-button" type="button" aria-pressed="false">compare</button>
          </div>
          <p class="map-view-note" id="view-note" hidden></p>
        </div>
        <div class="map-hud map-hud-bl"><p class="map-hint" id="view-caption">DRAG: ORBIT · SCROLL / PINCH: ZOOM</p></div>
        <div class="map-hud map-hud-br" data-label-avoid>
          <div class="map-controls" role="group" aria-label="View controls">
            <button class="acidburn-button" type="button" data-pane-toggle="specs-pane" aria-controls="specs-pane" aria-expanded="false">specs</button>
            <button class="acidburn-button" type="button" data-pane-toggle="options-pane" aria-controls="options-pane" aria-expanded="false">view</button>
            <button class="acidburn-button icon" type="button" id="bReset" aria-label="Reset view" title="Reset view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="2.5"/></svg></button>
            <button class="acidburn-button icon" type="button" data-map-action="in" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
            <button class="acidburn-button icon" type="button" data-map-action="out" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
            <button class="acidburn-button" type="button" id="bLab" aria-pressed="true">labels</button>
          </div>
        </div>

        <aside class="author-card map-pane" id="specs-pane" data-map-pane data-label-avoid hidden aria-labelledby="specs-pane-title">
          <div class="section-header window-toolbar"><h2 id="specs-pane-title">SPECIFICATIONS</h2><div class="section-line"></div><div class="window-actions">
            <button class="acidburn-button" type="button" data-pane-close aria-label="Close specifications" title="Close specifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
          </div></div>
          <div class="map-pane-body" id="ship-specs"><p>El Cajon · 62.90 m / Hackett · 194.10 m</p></div>
        </aside>
        <aside class="author-card map-pane" id="options-pane" data-map-pane data-label-avoid hidden aria-labelledby="options-pane-title">
          <div class="section-header window-toolbar"><h2 id="options-pane-title">VIEW</h2><div class="section-line"></div><div class="window-actions">
            <button class="acidburn-button" type="button" data-pane-close aria-label="Close view options" title="Close view options"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
          </div></div>
          <div class="map-pane-body">
            <p class="post-date" id="gravity-heading">Spin gravity</p>
            <div class="row" id="gbtns" role="group" aria-labelledby="gravity-heading"></div>
            <p id="readout"></p>
            <p class="post-date" id="display-heading">Display</p>
            <div class="row" role="group" aria-labelledby="display-heading">
              <button type="button" id="bSpin" class="acidburn-button" aria-pressed="false">spin</button>
              <button type="button" id="bOrbit" class="acidburn-button" aria-pressed="false">orbit cam</button>
              <button type="button" id="bEva" class="acidburn-button" aria-pressed="true">scale figure</button>
              <button type="button" id="bWire" class="acidburn-button" aria-pressed="false">wireframe</button>
              <button type="button" id="bCut" class="acidburn-button" aria-pressed="false">cutaway</button>
            </div>
          </div>
        </aside>
        <div id="err" role="status">Loading ship…</div>
      </div>
    </section>
    <noscript>This interactive schematic needs JavaScript.</noscript>
  </main>
  <script id="vertex-shader" type="x-shader/x-vertex">void main() { gl_Position = vec4(position, 1.0); }</script>
  <script data-src="raytracer.glsl" data-name="raytracer" type="x-shader/x-fragment"></script>

</body>
</html>
